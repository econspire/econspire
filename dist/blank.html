<!doctype html>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:#0d3d27;color:#fff;font:16px/1.55 "DM Sans",sans-serif}a{color:inherit}.shell{width:min(calc(100% - 48px),1280px);margin-inline:auto}header{height:76px;display:flex;align-items:center;border-bottom:1px solid #416a50}.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;font:700 1.45rem "Space Grotesk",sans-serif;letter-spacing:-.07em}.brand img{width:38px;height:38px;background:#fff;border-radius:50%;padding:3px}.brand b{color:#ddf45b}main{min-height:calc(100svh - 76px);display:grid;place-items:center;padding-block:45px}.panel{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end;width:100%;min-height:560px;padding:clamp(35px,7vw,90px);background:#ddf45b;color:#0d3d27;clip-path:polygon(0 0,94% 0,100% 12%,100% 100%,0 100%)}.panel::after{content:"";position:absolute;z-index:-1;right:-80px;top:-140px;width:500px;height:500px;border:1px solid #0d3d27;border-radius:50%;box-shadow:0 0 0 65px #ddf45b,0 0 0 66px #0d3d27,0 0 0 130px #ddf45b,0 0 0 131px #0d3d27}.eyebrow,.side-note{font:600 .75rem "IBM Plex Mono",monospace;letter-spacing:.08em}.eyebrow{display:inline-flex;gap:12px;align-items:center}.eyebrow::before{content:"";width:10px;height:10px;background:#0d3d27;border-radius:50%}h1{max-width:11ch;margin:30px 0 18px;font:700 clamp(3.6rem,7.5vw,8rem)/.96 "Space Grotesk",sans-serif;letter-spacing:-.08em}p{max-width:47ch;margin:0 0 32px;font-size:1.1rem}.button{display:inline-flex;gap:55px;align-items:center;min-height:54px;padding:12px 18px;background:#0d3d27;color:#fff;font-weight:800;text-decoration:none;box-shadow:5px 5px 0 rgba(13,61,39,.2);transition:transform .2s,box-shadow .2s}.button:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(13,61,39,.2)}.button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(13,61,39,.2)}.side-note{align-self:end;justify-self:end;writing-mode:vertical-rl;font-size:.8rem}.micro{position:absolute;right:15%;top:18%;font:700 5rem "Space Grotesk",sans-serif;transform:rotate(-14deg)}:focus-visible{outline:3px solid #fff;outline-offset:4px}@media(max-width:700px){.shell{width:min(calc(100% - 32px),1280px)}main{padding-block:20px}.panel{grid-template-columns:1fr;min-height:580px;padding:35px 25px;clip-path:polygon(0 0,88% 0,100% 6%,100% 100%,0 100%)}.panel::after{right:-280px;top:-80px}.side-note{writing-mode:initial;justify-self:start}.micro{right:12%;top:9%;font-size:3rem}h1{font-size:clamp(3.3rem,14vw,5rem)}.button{justify-content:space-between;width:100%}}
  </style>
</head>
<body>
  <header><div class="shell"><a class="brand" href="index.html#top" aria-label="Econspire home"><img src="assets/image-1.png" alt=""><span>econspire<b>.</b></span></a></div></header>
  <main class="shell"><section class="panel" aria-labelledby="page-title"><div><span class="eyebrow">NEXT CHAPTER / IN PROGRESS</span><h1 id="page-title">More is coming.</h1><p id="page-copy">This page is being prepared. Check back for the next announcement.</p><a class="button" id="back-link" href="index.html#events">Back to Econspire <span aria-hidden="true">↗</span></a></div><span class="micro" aria-hidden="true">✳</span><span class="side-note">ECONSPIRE / IDEAS IN MOTION / 2026</span></section></main>
  <script>
    const pages = {
      corporate: ["Corporate case registration", "Details for a future corporate case round will appear here when announced.", "events"],
      city: ["City events", "Confirmed city dates and sign-up details will appear here.", "events"],
      participant: ["Join a case", "Details for the next participant registration will appear here.", "join"],
      volunteer: ["Volunteer with us", "The next volunteer opportunity will be shared here when applications open.", "join"],
      ambassador: ["Represent your city", "Regional ambassador opportunities will be shared here when applications open.", "join"]
    };
    const page = pages[new URLSearchParams(location.search).get('for')];
    if (page) {
      document.querySelector('#page-title').textContent = page[0];
      document.querySelector('#page-copy').textContent = page[1];
      document.querySelector('#back-link').href = 'index.html#' + page[2];
      document.title = page[0] + ' — Econspire';
    }
  </script>
</body>
</html>
